<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3eee4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
  <title>오늘의 코디</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Serif+KR:wght@500;700&display=swap">

  <link rel="stylesheet" href="styles.css?v=19">
</head>
<body>
  <header class="topbar">
    <div class="mast">
      <span class="eyebrow" id="eyebrow">Daily Lookbook</span>
      <h1 id="title">오늘의 코디</h1>
      <span id="subtitle" class="muted"></span>
    </div>
    <span id="topAction"></span>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="today" class="on"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg></span>오늘 코디</button>
    <button data-tab="closet"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 8.2V7a2.2 2.2 0 1 0-2.2-2.2"/><path d="M12 8.2 3.4 14.6c-1 .8-.5 2.4.8 2.4h15.6c1.3 0 1.8-1.6.8-2.4L12 8.2Z"/></svg></span>옷장</button>
    <button data-tab="worn"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="5.2" r="2.4"/><path d="M8 21.5v-7l-1.6-4.2a1.6 1.6 0 0 1 1.5-2.1h8.2a1.6 1.6 0 0 1 1.5 2.1L16 14.5v7M12 14.5v7"/></svg></span>내 코디</button>
    <button data-tab="shop"><span class="ico"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12.5H6L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg></span>쇼핑</button>
    <button data-tab="settings"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg></span>설정</button>
  </nav>

  <dialog id="sheet"></dialog>
  <dialog id="viewer"></dialog>
  <div id="toast" class="toast" hidden></div>

  <script src="data/catalog.js?v=19"></script>
  <script src="data/rules.js?v=19"></script>
  <script src="data/channel.js?v=19"></script>
  <script src="data/basics.js?v=19"></script>
  <script src="data/rules_log.js?v=19"></script>
  <script src="data/demo.js?v=19"></script>
  <script src="js/engine.js?v=19"></script>
  <script src="js/db.js?v=19"></script>
  <script src="js/sync.js?v=19"></script>
  <script src="js/bg.js?v=19"></script>
  <script src="js/app.js?v=19"></script>

</html>
